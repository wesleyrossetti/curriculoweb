	<!-- Data loader — deve vir após data.js -->
	<script src="assets/js/loader.js"></script>

	<script>
		/* Contact form — sends via Web3Forms (https://web3forms.com) */
		function sendContactForm() {
			var key     = window._web3formsKey || '';
			var name    = document.getElementById('name').value.trim();
			var email   = document.getElementById('email').value.trim();
			var message = document.getElementById('message').value.trim();
			var btn     = document.getElementById('contact-submit');
			var resp    = document.querySelector('.ajax-response');

			if (!name || !email || !message) {
				resp.innerHTML = '<span style="color:#e74c3c">Preencha todos os campos.</span>';
				resp.style.display = 'block';
				return;
			}
			if (!key || key === 'COLOQUE_SUA_CHAVE_AQUI') {
				resp.innerHTML = '<span style="color:#e74c3c">Configure a chave Web3Forms em data.json.</span>';
				resp.style.display = 'block';
				return;
			}

			btn.disabled = true;
			btn.innerHTML = '<i class="fas fa-spinner fa-spin icon-before"></i> Enviando...';

			fetch('https://api.web3forms.com/submit', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
				body: JSON.stringify({ access_key: key, name: name, email: email, message: message })
			})
			.then(function (r) { return r.json(); })
			.then(function (data) {
				if (data.success) {
					resp.innerHTML = '<span style="color:#2ecc71">Mensagem enviada com sucesso!</span>';
					document.getElementById('name').value    = '';
					document.getElementById('email').value   = '';
					document.getElementById('message').value = '';
				} else {
					resp.innerHTML = '<span style="color:#e74c3c">Erro ao enviar. Tente novamente.</span>';
				}
				resp.style.display = 'block';
			})
			.catch(function () {
				resp.innerHTML = '<span style="color:#e74c3c">Erro de conexão. Tente novamente.</span>';
				resp.style.display = 'block';
			})
			.finally(function () {
				btn.disabled = false;
				btn.innerHTML = '<i class="fas fa-bullhorn icon-before"></i> Entre em contato';
			});
		}
	</script>
